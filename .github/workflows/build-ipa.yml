# Builds YOUR unsigned IPA from YOUR game files.
# Run it from the Actions tab of your own PRIVATE copy of this repository
# (or let the website builder start it for you).
name: Build my IPA

on:
  workflow_dispatch:
    inputs:
      game_files:
        description: "Where the build gets your game files"
        type: choice
        options:
          - my server (Tailscale)
          - uploaded with the website builder
        default: my server (Tailscale)
      paid_account:
        description: "I have a paid Apple developer account (request extra memory)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      FROM_UPLOAD: ${{ inputs.game_files == 'uploaded with the website builder' }}
    steps:
      - name: Refuse to build in a public repository
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::Make your copy of this repository PRIVATE first. The app you build contains the game engine from your own files, and public build results can be downloaded by anyone."
          exit 1

      - uses: actions/checkout@v4

      - name: Get the files you uploaded with the website builder
        if: ${{ env.FROM_UPLOAD == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: build-inputs
          path: uploaded-inputs

      - name: Join your tailnet (to reach your game-file server)
        if: ${{ env.FROM_UPLOAD != 'true' }}
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Check your server answers
        if: ${{ env.FROM_UPLOAD != 'true' }}
        env:
          SERVER: ${{ secrets.GAME_SERVER_URL }}
        run: |
          for i in $(seq 1 30); do
            if curl -sfI "$SERVER/data/manifest.json" > /dev/null; then echo "Server reachable."; exit 0; fi
            sleep 5
          done
          echo "::error::Can't reach $SERVER/data/manifest.json from the build machine. Is your server running and is GAME_SERVER_URL right?"
          exit 1

      - name: Install build tools
        run: brew install xcodegen

      - name: Use this repository's prebuilt shader translator, if it has one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download shadertool-1 --repo "${{ github.repository }}" --pattern pgmsl-macos-arm64.tar.gz --dir "$RUNNER_TEMP" 2>/dev/null; then
            echo "PGMSL_PREBUILT_URL=file://$RUNNER_TEMP/pgmsl-macos-arm64.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Make sure the Metal shader compiler is installed
        run: xcrun -sdk iphoneos metal --version > /dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain

      - name: Build the IPA (about 25 minutes)
        env:
          SERVER: ${{ secrets.GAME_SERVER_URL }}
          JOBS: "2"
        run: |
          if [ "$FROM_UPLOAD" = "true" ]; then
            /usr/bin/python3 app/Scripts/assemble_inputs.py --inputs uploaded-inputs --out "$RUNNER_TEMP/game-files"
            ./build_ipa.sh --mirror "$RUNNER_TEMP/game-files" ${{ inputs.paid_account && '--paid' || '' }}
          else
            ./build_ipa.sh "$SERVER" ${{ inputs.paid_account && '--paid' || '' }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GTA5Port-ipa
          path: GTA5Port.ipa
          retention-days: 3

      - name: Publish the IPA as a release in this private repository (easy to download on a phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-ipa --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-ipa GTA5Port.ipa --repo "${{ github.repository }}" --title "Your app (built $(date -u +%Y-%m-%d))" \
            --notes "Download GTA5Port.ipa and open it with SideStore or AltStore. This release is private like the repository."
